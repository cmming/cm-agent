# Local development/debug profile only. This file defines variables only.

cm-agent:
  config:
    jwt-secret: ${CM_AGENT_JWT_SECRET:}
    bootstrap-admin-enabled: true
    bootstrap-admin-username: admin
    bootstrap-admin-password: ${CM_AGENT_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-display-name: 本地管理员
    persistence-mode: memory
    fake-runtime-enabled: true
  agentscope:
    studio:
      # Studio 是本地调试工具；启动 Studio 后再显式把此开关设为 true。
      enabled: false
      url: ${CM_AGENT_STUDIO_URL:http://localhost:8000}
      project: cm-agent-local
      run-name: cm-agent-local

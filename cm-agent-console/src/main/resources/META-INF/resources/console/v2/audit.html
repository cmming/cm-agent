    <main class="workspace">
        <header class="workspace-header"><div><p class="eyebrow">当前工作区</p><h1>审计日志</h1><p class="muted">追踪当前租户的安全事件和资源操作。</p></div><div class="user-actions"><span class="online-dot" aria-label="已登录"></span><span id="currentUser">—</span><button id="logoutBtn" class="button ghost" type="button">退出</button></div></header>

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>运行记录 | CM Agent 控制台 v2</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/console/v2/assets/multipage.css">
</head>
<body data-console-version="v2" data-page="runsPage">
<div class="console-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark small" aria-hidden="true">CM</div><div><strong>CM Agent</strong><span>管理控制台</span></div><span class="version-badge">V2</span></div>
        <nav id="sidebarNav" aria-label="控制台导航">
            <a class="nav-item" href="/console/v2/overview.html"><span aria-hidden="true">▦</span>能力总览</a>
            <a class="nav-item" href="/console/v2/agents.html"><span aria-hidden="true">◇</span>Agent 管理</a>
            <a class="nav-item" href="/console/v2/model-configs.html"><span aria-hidden="true">◉</span>模型配置</a>
            <a class="nav-item" href="/console/v2/tools.html"><span aria-hidden="true">⬡</span>工具治理</a>
            <a class="nav-item active" href="/console/v2/runs.html" aria-current="page"><span aria-hidden="true">▷</span>运行记录</a>
            <a class="nav-item" href="/console/v2/audit.html"><span aria-hidden="true">≡</span>审计日志</a>
        </nav>
        <div class="sidebar-links"><span>版本与系统</span><a href="/console/v1/">旧版 v1 <b aria-hidden="true">↗</b></a><a href="/swagger-ui/index.html" target="_blank" rel="noreferrer">OpenAPI <b aria-hidden="true">↗</b></a><a href="/actuator/health" target="_blank" rel="noreferrer">健康检查 <b aria-hidden="true">↗</b></a></div>
    </aside>
    <main class="workspace">
        <header class="workspace-header"><div><p class="eyebrow">当前工作区</p><h1>运行记录</h1><p class="muted">执行 Agent，并查看运行历史、结果与工具调用。</p></div><div class="user-actions"><span class="online-dot" aria-label="已登录"></span><span id="currentUser">—</span><button id="logoutBtn" class="button ghost" type="button">退出</button></div></header>
        <p id="globalStatus" class="global-status" aria-live="polite" hidden></p>
        <section id="runsPage" class="page-view">
            <div class="run-toolbar panel"><div><label for="runAgentSelect">选择 Agent</label><select id="runAgentSelect"></select></div><form id="runForm"><label for="runInput">调试输入</label><div class="inline-form"><textarea id="runInput" rows="2" required></textarea><button id="runBtn" class="button primary" type="submit">执行运行</button></div><p id="runFormStatus" class="form-status" aria-live="polite"></p></form></div>
            <div class="split-grid">
                <article class="panel"><div class="panel-heading"><div><p class="eyebrow">历史</p><h2>运行记录</h2></div><button id="refreshRunsBtn" class="button ghost" type="button">刷新</button></div><div id="runList" class="resource-list"><p class="empty-state">请选择 Agent。</p></div><div class="load-more"><button id="loadMoreRunsBtn" class="button ghost" type="button" hidden>加载更多</button><span id="runsEndStatus"></span></div></article>
                <article id="runDetail" class="panel detail-panel"><p class="empty-state">选择一条运行记录查看详情。</p><div id="runToolCalls"></div></article>
            </div>
        </section>
    </main>
</div>
<script src="/assets/console-core.js?v=2.0.8"></script>
<script src="/assets/app.js?v=2.0.8"></script>
</body>
</html>
